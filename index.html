<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحة تحكم تلخيصات</title>
<meta name="theme-color" content="#3b2fa8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f3a;--mut:#6b7090;--pri:#5b4bdb;--pri2:#8a6cff;--bd:#e3e5f0;--dan:#d63b4b;--ok:#1d9a6c}
@media (prefers-color-scheme:dark){:root{--bg:#12142a;--card:#1c1f3b;--tx:#eceefc;--mut:#9aa0c8;--bd:#2c3058;--pri:#8a7bff;--pri2:#b19cff;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0)}
body{margin:0;color:var(--tx);font-family:'Cairo',Tahoma,'Segoe UI',Arial,sans-serif;line-height:1.7;padding-bottom:env(safe-area-inset-bottom,0);background:radial-gradient(1000px 400px at 50% -100px,color-mix(in srgb,var(--pri) 18%,transparent),transparent),var(--bg)}
header{background:linear-gradient(135deg,#3b2fa8,var(--pri) 55%,var(--pri2));color:#fff;padding:calc(14px + env(safe-area-inset-top,0)) 18px 14px;box-shadow:0 6px 24px -10px rgba(40,20,120,.6)}
.brand{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
.logo{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;font-size:22px}
header h1{margin:0;font-size:22px;font-weight:800;line-height:1.1}
header small{display:block;font-size:11px;font-weight:400;opacity:.85;margin-top:2px}
main{max-width:760px;margin:0 auto;padding:18px 16px 40px}
.hide{display:none!important}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:30px 20px;text-align:center;color:#fff;margin-bottom:20px;background:linear-gradient(135deg,#3b2fa8,var(--pri) 50%,var(--pri2));box-shadow:0 18px 40px -18px var(--pri);animation:up .7s both}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1)}
.hero::before{width:180px;height:180px;top:-70px;left:-50px}.hero::after{width:120px;height:120px;bottom:-50px;right:-30px}
.hero>*{position:relative}
.hero .em{font-size:44px;display:block;margin-bottom:6px;animation:fl 3s ease-in-out infinite}
.hero h2{margin:0 0 8px;font-size:26px;font-weight:800}
.hero p{margin:0 auto 16px;max-width:420px;opacity:.92;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips span{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);padding:5px 12px;border-radius:20px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.sub{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px 12px;text-align:center;cursor:pointer;font:inherit;font-size:15px;font-weight:700;color:var(--tx);box-shadow:0 8px 22px -14px rgba(60,40,160,.5);transition:transform .25s,box-shadow .25s,border-color .25s;animation:up .6s both}
.sub:hover,.sub:active{transform:translateY(-4px);box-shadow:0 16px 28px -14px var(--pri);border-color:var(--pri)}
.sub .ic{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 10px;border-radius:16px;font-size:26px;background:linear-gradient(135deg,color-mix(in srgb,var(--pri) 18%,transparent),color-mix(in srgb,var(--pri2) 28%,transparent))}
.sub small{background:color-mix(in srgb,var(--pri) 12%,transparent);color:var(--pri);display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;margin-top:8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px -16px rgba(60,40,160,.4);animation:up .5s both}
.card h3{margin:0 0 10px;font-weight:800;font-size:18px}
.item{display:flex;gap:10px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--bd);border-radius:10px;transition:background .2s}
.item:last-child{border:0}.item:hover{background:color-mix(in srgb,var(--pri) 6%,transparent)}
.num{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:50%;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.ttl{flex:1;font-weight:600}
button.b,a.b{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;padding:8px 14px;border-radius:12px;cursor:pointer;font:inherit;font-size:14px;font-weight:600;text-decoration:none;display:inline-block;transition:transform .15s,filter .2s}
button.b:active,a.b:active{transform:scale(.96)}
button.b:disabled{opacity:.6}
button.d{background:var(--dan)}
button.g{background:transparent;color:var(--pri);border:1px solid var(--pri)}
input,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 25%,transparent)}
label{font-size:14px;color:var(--mut)}
.row{display:flex;gap:8px}.row input{margin:0}
.empty{color:var(--mut);text-align:center;padding:16px}
.note{font-size:12px;color:var(--mut)}
.msg{font-size:13px;margin-right:6px}.ok{color:var(--ok)}.er{color:var(--dan)}
.warn{background:#fff3cd;color:#664d03;border-radius:12px;padding:12px;margin-bottom:14px;font-size:14px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:30;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0)) 10px calc(10px + env(safe-area-inset-bottom,0))}
#modal .bar{display:flex;gap:8px;margin-bottom:8px}
#pg{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:10px;background:#8886;padding:4px;text-align:center}
#pg canvas{display:block;margin:0 auto 6px;background:#fff;border-radius:4px}
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;background:radial-gradient(circle at 30% 20%,#7a63ff,#3b2fa8 55%,#1c1560);transition:opacity .7s,visibility .7s}
#splash.out{opacity:0;visibility:hidden}
#splash .lg{width:92px;height:92px;border-radius:28px;display:grid;place-items:center;font-size:48px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);animation:pop 1s cubic-bezier(.2,1.4,.4,1) both}
#splash h1{margin:6px 0 0;font-size:38px;font-weight:800;animation:up .8s .3s both}
#splash p{margin:0;opacity:.85;animation:up .8s .5s both}
#splash .ld{width:120px;height:4px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:18px}
#splash .ld i{display:block;height:100%;background:#fff;transform-origin:right;animation:ld 1.5s ease-out both}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.5) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes fl{50%{transform:translateY(-6px)}}
@keyframes ld{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">🛠️</div><h1>لوحة التحكم<small>تلخيصات — للأدمن فقط</small></h1></div></header>
<main>
<div id="cfgwarn" class="warn hide">⚠️ لسه ماحطيتش إعدادات Firebase في الكود (firebaseConfig).</div>
<section id="adm">
 <div id="login" class="card"><h3>🔒 دخول الأدمن</h3>
  <label>كلمة السر</label><input type="password" id="pw" autocomplete="current-password" dir="ltr">
  <button class="b" onclick="login()">دخول</button> 
  <span id="lm" class="msg"></span></div>
 <div id="panel" class="hide">
  <div class="card"><h3>📖 إدارة المواد</h3>
   <div class="row"><input id="ns" placeholder="اسم مادة جديدة"><button class="b" onclick="addSub()">إضافة</button></div>
   <div id="sl" style="margin-top:8px"></div></div>
  <div class="card"><h3>⬆️ رفع تلخيص</h3>
   <label>المادة</label><select id="us"></select>
   <label>عنوان المحاضرة</label><input id="ut" placeholder="مثال: المحاضرة الأولى - مقدمة">
   <label>ملف PDF واحد، أو مجموعة صور (تتحول لـ PDF واحد)</label><input type="file" id="uf" accept="application/pdf,image/*" multiple>
   <button class="b" id="ub" onclick="upload()">رفع</button><span id="um" class="msg"></span></div>
  <div class="card"><h3>🗂️ الملفات المرفوعة</h3><div id="al"></div></div>
  <div class="card"><h3>🔑 تغيير كلمة السر</h3>
   <label>كلمة السر الحالية</label><input type="password" id="p0" autocomplete="current-password" dir="ltr">
   <label>كلمة السر الجديدة (8 أحرف على الأقل)</label><input type="password" id="p1" autocomplete="new-password" dir="ltr">
   <label>تأكيد كلمة السر الجديدة</label><input type="password" id="p2" autocomplete="new-password" dir="ltr">
   <button class="b" onclick="changePw()">حفظ</button><span id="pm" class="msg"></span></div>
  <p class="note" id="who"></p>
  <button class="b d" onclick="logout()">تسجيل خروج</button>
 </div>
</section>
</main>
<div id="modal" class="hide"><div class="bar"><button class="b d" onclick="closeM()">إغلاق ✕</button><a class="b" id="dl" download>تحميل</a></div><div id="pg"></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,deleteDoc,query,orderBy,writeBatch} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,reauthenticateWithCredential,EmailAuthProvider,updatePassword,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

/* ====== الصق firebaseConfig بتاعك هنا ====== */
const firebaseConfig={
  apiKey:"AIzaSyDuI4BOEOzGflkAmWMoZS9Yfn9FsmKUQVk",
  authDomain:"talkhisat-6056d.firebaseapp.com",
  projectId:"talkhisat-6056d",
  storageBucket:"talkhisat-6056d.firebasestorage.app",
  messagingSenderId:"358024297176",
  appId:"1:358024297176:web:2f7c3c4e54839c30bf75ad"
};
/* ========================================== */

/* الإيميل ده مجرد اسم داخلي للأدمن (مش بيظهر لحد ومش لازم يكون حقيقي).
   لازم يكون هو نفسه اللي هتضيفه في Firebase Authentication وفي القواعد. */
const ADMIN_EMAIL="admin@talkhisat.com";

const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CHUNK=600000;
let subs=[],items=[],user=null,db,auth;
const configured=!firebaseConfig.apiKey.startsWith("YOUR");
if(configured){const app=initializeApp(firebaseConfig);db=getFirestore(app);auth=getAuth(app)}else $("cfgwarn").classList.remove("hide");



/* ---------- تحميل البيانات ---------- */
async function loadData(){
  if(!configured){render();return}
  try{
    const [s,i]=await Promise.all([getDocs(query(collection(db,"subjects"),orderBy("createdAt"))),getDocs(query(collection(db,"items"),orderBy("createdAt")))]);
    subs=s.docs.map(d=>({id:d.id,...d.data()}));items=i.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){$("al").innerHTML='<div class="empty">تعذر تحميل البيانات: '+esc(e.message)+'</div>';return}
  render();
}
function render(){
  $("sl").innerHTML=subs.map(s=>`<div class="item"><span class="ttl">${esc(s.name)}</span><button class="b d" onclick="delSub('${s.id}')">حذف</button></div>`).join("")||'<div class="empty">لا توجد مواد</div>';
  $("us").innerHTML=subs.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("");
  $("al").innerHTML=items.length?items.map(i=>`<div class="item"><span class="ttl">${esc(i.title)}<br><small class="note">${esc((subs.find(s=>s.id===i.sub)||{name:"—"}).name)}</small></span><button class="b g" onclick="view('${i.id}')">عرض</button><button class="b d" onclick="delItem('${i.id}')">حذف</button></div>`).join(""):'<div class="empty">لا توجد ملفات</div>';
}

/* ---------- عرض PDF ---------- */
window.view=async id=>{
  const it=items.find(x=>x.id===id);if(!it)return;
  const box=$("pg");box.innerHTML='<p class="empty">جاري التحميل...</p>';$("modal").classList.remove("hide");
  try{
    const parts=await Promise.all(Array.from({length:it.chunks},(_,n)=>getDoc(doc(db,"chunks",id+"_"+n))));
    const bin=atob(parts.map(p=>p.data().d).join(""));
    const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    $("dl").href=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));$("dl").download=it.title+".pdf";
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf=await pdfjsLib.getDocument({data:bytes}).promise;box.innerHTML="";
    for(let n=1;n<=pdf.numPages;n++){
      const p=await pdf.getPage(n),v0=p.getViewport({scale:1}),w=Math.min(box.clientWidth-8,900),sc=w/v0.width,v=p.getViewport({scale:sc*(devicePixelRatio||1)}),c=document.createElement("canvas");
      c.width=v.width;c.height=v.height;c.style.width=w+"px";c.style.height=(v0.height*sc)+"px";box.appendChild(c);
      await p.render({canvasContext:c.getContext("2d"),viewport:v}).promise;
    }
  }catch(e){box.innerHTML='<p class="empty">تعذر عرض الملف: '+esc(e.message)+'</p>'}
};
window.closeM=()=>{$("modal").classList.add("hide");$("pg").innerHTML=""};

/* ---------- الأدمن: دخول وخروج ---------- */
if(configured)onAuthStateChanged(auth,u=>{user=u;$("login").classList.toggle("hide",!!u);$("panel").classList.toggle("hide",!u);if(u)$("who").textContent="مسجل دخول بـ: "+u.email});
const say=(id,t,ok)=>{const e=$(id);e.textContent=t;e.className="msg "+(ok?"ok":"er")};
window.login=async()=>{
  if(!configured)return say("lm","اضبط إعدادات Firebase أولاً");
  try{await signInWithEmailAndPassword(auth,ADMIN_EMAIL,$("pw").value);$("pw").value="";say("lm","",1)}
  catch(e){say("lm","كلمة السر غلط")}
};
window.forgot=async()=>{
  const m=ADMIN_EMAIL;
  try{await sendPasswordResetEmail(auth,m);say("lm","اتبعت رابط إعادة التعيين على الإيميل",1)}catch(e){say("lm","تعذر الإرسال")}
};
window.logout=async()=>{await signOut(auth)};
window.changePw=async()=>{
  const a=$("p0").value,b=$("p1").value,c=$("p2").value;
  if(!a||!b)return say("pm","املأ كل الحقول");
  if(b.length<8)return say("pm","كلمة السر الجديدة لازم 8 أحرف على الأقل");
  if(b!==c)return say("pm","التأكيد مش مطابق");
  try{
    await reauthenticateWithCredential(user,EmailAuthProvider.credential(user.email,a));
    await updatePassword(user,b);
    $("p0").value=$("p1").value=$("p2").value="";say("pm","✅ تم تغيير كلمة السر",1);
  }catch(e){say("pm",e.code==="auth/invalid-credential"||e.code==="auth/wrong-password"?"كلمة السر الحالية غلط":"تعذر التغيير: "+e.code)}
};

/* ---------- الأدمن: المواد والملفات ---------- */
window.addSub=async()=>{
  const n=$("ns").value.trim();if(!n||!user)return;
  try{await setDoc(doc(collection(db,"subjects")),{name:n,createdAt:Date.now()});$("ns").value="";await loadData()}catch(e){alert("تعذر الحفظ: "+e.message)}
};
async function rmItem(it){
  await Promise.all(Array.from({length:it.chunks||0},(_,n)=>deleteDoc(doc(db,"chunks",it.id+"_"+n))));
  await deleteDoc(doc(db,"items",it.id));
}
window.delSub=async id=>{
  if(!user||!confirm("حذف المادة وكل ملخصاتها؟"))return;
  try{for(const it of items.filter(x=>x.sub===id))await rmItem(it);await deleteDoc(doc(db,"subjects",id));await loadData()}catch(e){alert("تعذر الحذف: "+e.message)}
};
window.delItem=async id=>{
  if(!user||!confirm("حذف الملف؟"))return;
  try{await rmItem(items.find(x=>x.id===id));await loadData()}catch(e){alert("تعذر الحذف: "+e.message)}
};
function img(f){return new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1400/im.width),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);r({d:c.toDataURL("image/jpeg",.8),w:c.width,h:c.height})};im.onerror=j;im.src=fr.result};fr.onerror=j;fr.readAsDataURL(f)})}
async function toPdf(files){
  const {jsPDF}=window.jspdf;let d=null;
  for(const f of files){const o=await img(f),or=o.w>o.h?"l":"p";if(!d)d=new jsPDF({unit:"px",format:[o.w,o.h],orientation:or});else d.addPage([o.w,o.h],or);d.addImage(o.d,"JPEG",0,0,o.w,o.h)}
  return d.output("arraybuffer");
}
function b64(buf){const u=new Uint8Array(buf);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
window.upload=async()=>{
  if(!user)return;
  const t=$("ut").value.trim(),s=$("us").value,fs=[...$("uf").files];
  if(!s)return say("um","أضف مادة أولاً");if(!t)return say("um","اكتب عنوان المحاضرة");if(!fs.length)return say("um","اختر ملفات");
  const pdfs=fs.filter(f=>f.type==="application/pdf");
  if(pdfs.length&&pdfs.length!==fs.length)return say("um","اختر إما ملف PDF أو صور، مش الاتنين مع بعض");
  if(pdfs.length>1)return say("um","ارفع ملف PDF واحد في المرة");
  const btn=$("ub");btn.disabled=true;say("um","جاري المعالجة...",1);
  try{
    const buf=pdfs.length?await pdfs[0].arrayBuffer():await toPdf(fs);
    const str=b64(buf),n=Math.ceil(str.length/CHUNK),ref=doc(collection(db,"items"));
    for(let i=0;i<n;i+=6){
      const wb=writeBatch(db);
      for(let k=i;k<Math.min(n,i+6);k++)wb.set(doc(db,"chunks",ref.id+"_"+k),{d:str.slice(k*CHUNK,(k+1)*CHUNK)});
      await wb.commit();say("um","جاري الرفع "+Math.min(100,Math.round((i+6)/n*100))+"%",1);
    }
    await setDoc(ref,{sub:s,title:t,chunks:n,createdAt:Date.now()});
    $("ut").value="";$("uf").value="";say("um","✅ تم الرفع"+(pdfs.length?"":" وتحويل الصور إلى PDF"),1);await loadData();
  }catch(e){say("um","حصل خطأ: "+e.message)}
  btn.disabled=false;
};
loadData();
</script>
</body>
</html>
